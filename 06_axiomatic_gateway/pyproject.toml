[tool.poetry]
name = "axiomatic-gateway"
version = "1.0.0"
description = "FastAPI Scientific Computing API Gateway orchestrating SAT, Quantum, and Chemistry solvers"
authors = ["Software & AI Developer"]
readme = "README.md"
packages = [{include = "app", from = "backend"}]

[tool.poetry.dependencies]
python = "^3.9"
fastapi = "^0.100.0"
uvicorn = "^0.22.0"
pydantic = "^2.0.0"

[tool.poetry.group.dev.dependencies]
pytest = "^7.0.0"
httpx = "^0.24.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
