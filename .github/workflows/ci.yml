name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check app/prover.py app/parser.py app/problems.py app/sat.py app/engines.py app/cache.py app/registry.py app/main.py app/benchmarks.py app/cli.py tests/test_v2.py
      - run: mypy app
      - run: pytest
      - name: Smoke benchmark
        run: axiomatic bench --quick --no-plot
