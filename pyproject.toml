[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "axiomatic-gateway"
version = "2.0.0"
description = "Self-verifying resolution prover and scientific-computing API gateway (FastAPI)"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "Cyb0rg137ms" }]
dependencies = ["fastapi>=0.110", "pydantic>=2.5", "uvicorn>=0.27"]

[project.optional-dependencies]
plot = ["matplotlib>=3.7"]
dev = ["pytest>=8", "pytest-timeout>=2.2", "httpx>=0.27", "ruff>=0.6", "mypy>=1.10", "matplotlib>=3.7"]

[project.scripts]
axiomatic = "app.cli:main"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E731", "B008", "RUF001", "RUF002", "RUF003", "RUF022", "UP006", "UP035", "UP045", "UP007"]

[tool.ruff.lint.per-file-ignores]
"tests/test_api.py" = ["F401", "I001", "W291", "W293"]
"tests/test_logic.py" = ["RUF015", "RUF059", "F401", "I001", "W291", "W293", "E501", "E741", "F403", "F405"]
"app/legacy.py" = ["ALL"]
"app/logic.py" = ["RUF013", "B905", "SIM110", "E741", "W291", "W293", "E501", "F401", "I001", "UP"]
"app/proof.py" = ["RUF013", "B007", "F841", "E721", "E741", "W291", "W293", "E501", "SIM"]
"app/axioms.py" = ["F401", "I001", "W291", "W293", "E501", "UP"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
exclude = ["app/legacy.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --timeout=600"
filterwarnings = ["ignore::DeprecationWarning"]
